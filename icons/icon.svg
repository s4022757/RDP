<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient grounded in Variant 1 Deep Teal #102D37 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163A45" />
      <stop offset="60%" stop-color="#102D37" />
      <stop offset="100%" stop-color="#091A20" />
    </linearGradient>

    <!-- Ambient Starlight Glow -->
    <radialGradient id="sparkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECF8C0" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D2F7F9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#102D37" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Kiosk App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Starlight Ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(236, 248, 192, 0.12)" stroke-width="1.5" stroke-dasharray="4 6" fill="none" />

  <!-- Ambient Radiant Core Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#sparkAura)" />

  <!-- Constellate Official 6-Ribbon Spark Mark (Page 11 & Page 14 of styleguide.pdf) -->
  <g fill="#ECF8C0" filter="url(#softGlow)">
    <!-- Top upright arm -->
    <path d="M 257.5,232 L 274.5,132 L 310.5,132 L 284.5,224 L 268.5,236 L 257.5,237 Z" />
    <!-- Top-left arm -->
    <path d="M 203.5,178 L 238.5,178 L 256.5,237 L 244.5,236 L 229.5,225 Z" />
    <!-- Right wing -->
    <path d="M 275.5,257 L 279.5,242 L 286.5,233 L 339.5,207 L 339.5,240 L 277.5,257 L 387.5,273 L 388.5,307 L 292.5,284 L 280.5,273 Z" />
    <!-- Bottom downwards arm -->
    <path d="M 201.5,379 L 227.5,289 L 237.5,279 L 255.5,275 L 237.5,380 Z" />
    <!-- Left wing -->
    <path d="M 123.5,205 L 220.5,229 L 227.5,234 L 235.5,249 L 233.5,269 L 218.5,284 L 172.5,306 L 171.5,273 L 234.5,255 L 124.5,239 Z" />
    <!-- Bottom-right arm -->
    <path d="M 256.5,275 L 271.5,278 L 284.5,289 L 309.5,335 L 273.5,335 Z" />
  </g>
</svg>
